Options:
  Sdl:
    DisplayName: Display and Window
    Description: Output device, fullscreen behaviour, window size and mouse capture.
    Options:
      Fullscreen:
        Type: bool
        Description: Start DOSBox-X directly in fullscreen. (Press [F11/F12]+F to go back)
        Default: "false"
      Fulldouble:
        Type: bool
        Description: Use double buffering in fullscreen. It can reduce screen flickering, but it can also result in a slow DOSBox-X.
        Default: "false"
      Fullresolution:
        Type: string
        Description: "What resolution to use for fullscreen: original, desktop or a fixed size (e.g. 1024x768). Using your monitor's native resolution with aspect=true might give the best results. If you end up with small window on a large screen, try an output different from surface."
        Default: desktop
      Windowresolution:
        Type: string
        Description: Scale the window to this size IF the output device supports hardware scaling. (output=surface does not!)
        Default: original
      Windowposition:
        Type: string
        Description: 'Set the window position at startup in the positionX,positionY format (e.g.: 1300,200). The window will be centered with "," (or empty), and will be in the original position with "-".'
        Default: '-'
      Display:
        Type: int
        Description: Specify a screen/display number to use for a multi-screen setup (0 = default).
        Default: "0"
      Output:
        Type: choice
        Description: What video system to use for output (surface = software (SDL_Surface); openglnb = OpenGL nearest; openglpp = OpenGL perfect; ttf = TrueType font output).
        Default: default
        Choices:
        - default
        - surface
        - ttf
        - opengl
        - openglnb
        - openglhq
        - openglpp
      Videodriver:
        Type: string
        Description: Forces a video driver (e.g. windib/windows, directx, x11, fbcon, dummy, etc) for the SDL library to use.
      Transparency:
        Type: int
        Description: Set the transparency of the DOSBox-X screen (both windowed and full-screen modes, on SDL2 and Windows SDL1 builds). The valid value is from 0 (no transparency, the default setting) to 90 (high transparency).
        Default: "0"
      Maximize:
        Type: bool
        Description: If set, the DOSBox-X window will be maximized at start (SDL2 and Windows SDL1 builds only; use fullscreen for TTF output).
        Default: "false"
      Autolock:
        Type: bool
        Description: Mouse will automatically lock, if you click on the screen. (Press CTRL-F10 to unlock)
        Default: "false"
      Autolock_feedback:
        Type: choice
        Description: Autolock status feedback type, i.e. visual, auditive, none.
        Default: beep
        Choices:
        - none
        - beep
        - flash
      Middle_unlock:
        Type: choice
        Description: Whether you can press the middle mouse button to unlock the mouse when the mouse has been locked. If set to "manual", it works only with "autolock=false"; if set to "auto", it works only with "autolock=true".
        Default: manual
        Choices:
        - none
        - manual
        - auto
        - both
      Clip_mouse_button:
        Type: choice
        Description: Select the mouse button or use arrow keys for the shared clipboard copy/paste function. The default mouse button is "right", which means using the right mouse button to select text, copy to and paste from the host clipboard. Set to "middle" to use the middle mouse button, "arrows" to use arrow keys instead of a mouse button, or "none" to disable this feature. For "arrows", press Home key (or Fn+Shift+Left on Mac laptops) to start selection, and End key (or Fn+Shift+Right on Mac laptops) to end selection.
        Default: right
        Choices:
        - none
        - middle
        - right
        - arrows
      Clip_key_modifier:
        Type: choice
        Description: Change the keyboard modifier for the shared clipboard copy/paste function using a mouse button or arrow keys. The default modifier is "shift" (both left and right shift keys). Set to "none" if no modifier is desired.
        Default: shift
        Choices:
        - none
        - ctrl
        - lctrl
        - rctrl
        - alt
        - lalt
        - ralt
        - shift
        - lshift
        - rshift
        - ctrlalt
        - ctrlshift
        - altshift
        - lctrlalt
        - lctrlshift
        - laltshift
        - rctrlalt
        - rctrlshift
        - raltshift
      Clip_paste_bios:
        Type: choice
        Description: Specify whether to use BIOS keyboard functions for the clipboard pasting instead of the keystroke method. For pasting clipboard text into Windows 3.x/9x applications (e.g. Notepad), make sure to use the keystroke method.
        Default: default
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - default
      Clip_paste_speed:
        Type: int
        Description: Set keyboard speed for pasting text from the shared clipboard. If the default setting of 30 causes lost keystrokes, increase the number. Or experiment with decreasing the number for applications that accept keystrokes quickly.
        Default: "30"
      Sensitivity:
        Type: int
        Description: Mouse sensitivity. The optional second parameter specifies vertical sensitivity (e.g. 100,-50).
        Default: "100"
      Usesystemcursor:
        Type: bool
        Description: Use the mouse cursor of the host system instead of drawing a DOS mouse cursor. Activated when the mouse is not locked.
        Default: "false"
      Mouse_emulation:
        Type: choice
        Description: 'When is mouse emulated ? integration: when not locked locked: when locked always: every time never: at no time If disabled, the mouse position in DOSBox-X is exactly where the host OS reports it. When using a high DPI mouse, the emulation of mouse movement can noticeably reduce the sensitiveness of your device, i.e. the mouse is slower but more precise.'
        Default: locked
        Choices:
        - integration
        - locked
        - always
        - never
      Mouse_wheel_key:
        Type: int
        Description: 'Convert mouse wheel movements into keyboard presses such as arrow keys. 0: disabled; 1: up/down arrows; 2: left/right arrows; 3: PgUp/PgDn keys. 4: Ctrl+up/down arrows; 5: Ctrl+left/right arrows; 6: Ctrl+PgUp/PgDn keys. 7: Ctrl+W/Z, as supported by text editors like WordStar and MS-DOS EDIT. Putting a minus sign in front will disable the conversion for guest systems.'
        Default: "-1"
      Waitonerror:
        Type: bool
        Description: Wait before closing the console if DOSBox-X has an error.
        Default: "true"
      Priority:
        Type: string
        DisplayName: Process Priority
        Description: |
          Priority DOSBox-X runs at, as focused,unfocused. Valid values for each half are lowest, lower, normal, higher and highest; the second half also accepts pause, which freezes the emulator entirely when the window loses focus.
        Default: higher,normal
        Choices:
        - lowest
        - lower
        - normal
        - higher
        - highest
        - pause
      Mapperfile:
        Type: string
        Description: File used to load/save the key/event mappings from. Resetmapper only works with the default value.
        Default: mapper-dosbox-x.map
      Usescancodes:
        Type: choice
        Description: Avoid usage of symkeys, in favor of scancodes. Might not work on all operating systems. If set to "auto" (default), it is enabled when using non-US keyboards in SDL1 builds.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Overscan:
        Type: int
        Description: Width of the overscan border (0 to 10) for the "surface" output.
        Default: "0"
      Titlebar:
        Type: string
        Description: Change the string displayed in the DOSBox-X title bar.
      Showbasic:
        Type: bool
        Description: If set, DOSBox-X will show basic information including the DOSBox-X version number and current running speed in the title bar.
        Default: "true"
      Showdetails:
        Type: bool
        Description: If set, DOSBox-X will show the cycles count (FPS) and emulation speed relative to realtime in the title bar.
        Default: "false"
      Showmenu:
        Type: bool
        Description: Whether to show the menu bar (if supported). Default true.
        Default: "true"
  Render:
    DisplayName: Rendering and Scaling
    Description: Scalers, aspect correction, frame skipping and shader selection.
    Options:
      Frameskip:
        Type: int
        Description: How many frames DOSBox-X skips before drawing one.
        Default: "0"
      Aspect:
        Type: choice
        Description: "Aspect ratio correction mode. Can be set to the following values: 'false' (default): 'direct3d'/opengl outputs: image is simply scaled to full window/fullscreen size, possibly resulting in dis- proportional image 'surface' output: it does no aspect ratio correction, resulting in disproportional images if VGA mode pixel ratio is not 4:3 (default) 'true': 'direct3d'/opengl outputs: uses output driver functions to scale / pad image with black bars, correcting output to proportional 4:3 image In most cases image degradation should not be noticeable (it all depends on the video adapter and how much the image is upscaled). Should have none to negligible impact on performance, mostly being done in hardware. For the pixel-perfect scaling (output=openglpp), it is recommended to enable this whenever the emulated display has an aspect ratio of 4:3 'surface' output: inherits old DOSBox aspect ratio correction method (adjusting rendered image line count to correct output to 4:3 ratio) Due to source image manipulation this mode does not mix well with scalers, i.e. multiline scalers like hq2x/hq3x will work poorly Slightly degrades visual image quality. Has a tiny impact on performance. When using xBRZ scaler with 'surface' output, aspect ratio correction is done by the scaler itself, so none of the above apply."
        Default: "false"
        Choices:
        - "false"
        - "true"
        - "0"
        - "1"
        - "yes"
        - "no"
        - nearest
        - bilinear
      Aspect_ratio:
        Type: string
        Description: Set the aspect ratio (e.g. 16:9) in the aspect ratio correction mode. 0:0 means the default ratio of 4:3, and -1:-1 means the original image ratio.
        Default: 0:0
      Char9:
        Type: bool
        Description: Allow 9-pixel wide text mode fonts instead of 8-pixel wide fonts.
        Default: "true"
      Euro:
        Type: int
        Description: Display Euro symbol instead of the specified ASCII character (33-255). For example, setting it to 128 allows Euro symbol to be displayed instead of C-cedilla.
        Default: "-1"
      Doublescan:
        Type: bool
        Description: If set, doublescanned output emits two scanlines for each source line, in the same manner as the actual VGA output (320x200 is rendered as 640x400 for example). If clear, doublescanned output is rendered at the native source resolution (320x200 as 320x200). This affects the raster PRIOR to the software or hardware scalers. Setting this option may prevent some scalers to work as expected. Try turning this option off in such case. For pixel-perfect scaling (output=openglpp), it is recommended to turn this option off.
        Default: "true"
      Scaler:
        Type: choice
        Description: Scaler used to enlarge/enhance low resolution modes. Add keyword 'forced', after the name of the scaler to always use the scaler even if the result might not be desired.(e.g. 'normal2x forced') Appending 'prompt' will cause a confirmation message for forcing the scaler. To fit a scaler in the resolution used at full screen may require a border or side bars. To fill the screen entirely, depending on your hardware, a different scaler/fullresolution might work. Scalers should work with most output options, but they are ignored for openglpp and TrueType font outputs. If you are using OpenGL/Direct3D output and a shader that requires it, set to hardware_none or hardware2x.
        Default: normal2x
        Choices:
        - none
        - normal2x
        - normal3x
        - normal4x
        - normal5x
        - advmame2x
        - advmame3x
        - advinterp2x
        - advinterp3x
        - hq2x
        - hq3x
        - 2xsai
        - super2xsai
        - supereagle
        - tv2x
        - tv3x
        - rgb2x
        - rgb3x
        - scan2x
        - scan3x
        - gray
        - gray2x
        - hardware_none
        - hardware2x
        - hardware3x
        - hardware4x
        - hardware5x
        - xbrz
        - xbrz_bilinear
      Glshader:
        Type: string
        Description: 'Path to GLSL shader source to use with OpenGL output ("none" to disable, or "default" for default shader). Can be either an absolute path, a file in the "glshaders" subdirectory of the DOSBox-X configuration directory, or one of the built-in shaders (e.g. "sharp" for the pixel-perfect scaling mode): advinterp2x, advinterp3x, advmame2x, advmame3x, rgb2x, rgb3x, scan2x, scan3x, tv2x, tv3x, sharp.'
        Default: none
      Pixelshader:
        Type: string
        Description: Set Direct3D pixel shader program (effect file must be in Shaders subdirectory). If 'forced' is appended, then the pixel shader will be used even if the result might not be desired.
        Default: none
      Autofit:
        Type: bool
        Description: Best fits image to window Intended for output=direct3d, fullresolution=original, aspect=true
        Default: "true"
      Monochrome_pal:
        Type: choice
        Description: Specify the color of monochrome display. Append 'bright' for a brighter look.
        Default: green
        Choices:
        - green
        - amber
        - gray
        - white
  Dosbox:
    DisplayName: Machine and Emulation
    Description: |
      Which PC DOSBox-X pretends to be. 'machine' is the single most important setting here -- it decides the graphics hardware a game sees, and a game written for CGA or Tandy will not look right on the SVGA default.
    Options:
      Language:
        Type: string
        Description: Select a language file for DOSBox-X to use. Encoded with either UTF-8 or a DOS code page. You can set code page either in the language file or with "country" setting in [config] section.
      Beepduration:
        Type: int
        Description: If nonzero, set the duration of a beep when DOS or INT 10h is given a BEL character
        Default: "0"
      Title:
        Type: string
        Description: Additional text to place in the title bar of the window.
      Logotext:
        Type: string
        Description: Text to place at the bottom of the screen during the startup logo. Text will line wrap automatically. To explicitly break to the next line, put \n in the string.
      Logo:
        Type: string
        Description: Location of PNG images to use in place of the DOSBox-X logo at startup. This is the path of the base file name. For example logo=subdir\sets\007\logo with machine=vgaonly will use subdir\sets\007\logo224x224.png as the logo.
      Fastbioslogo:
        Type: bool
        Description: If set, DOSBox-X will skip the BIOS screen by activating fast BIOS logo mode (without 1-second pause).
        Default: "false"
      Startbanner:
        Type: bool
        Description: If set (default), DOSBox-X will display the welcome banner when it starts.
        Default: "true"
      Bannercolortheme:
        Type: choice
        Description: You can specify a different background color theme for the welcome banner from the default one.
        Default: default
        Choices:
        - default
        - black
        - red
        - green
        - yellow
        - blue
        - magenta
        - cyan
        - white
      Configurationtooltheme:
        Type: choice
        Description: Theme for the configuration tool. If not set, host dark mode setting will be followed.
        Choices:
        - Windows Default
        - Arizona
        - Black Leather Jacket
        - Bordeaux
        - Cinnamon
        - Designer
        - Emerald City
        - Fluorescent
        - HotDog Stand
        - LCD Default Screen Settings
        - LCD Reversed - Dark
        - LCD Reversed - Light
        - Mahogany
        - Monochrome
        - Ocean
        - Pastel
        - Patchwork
        - Plasma Power Saver
        - Rugby
        - The Blues
        - Tweed
        - Valentine
        - Wingtips
      Dpiaware:
        Type: choice
        Description: Set this option (auto by default) to indicate to your OS that DOSBox-X is DPI aware. If it is not set, Windows Vista/7/8/10 and higher may upscale the DOSBox-X window on higher resolution monitors which is probably not what you want.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Quitwarning:
        Type: choice
        Description: Set this option to indicate whether DOSBox-X should show a warning message when the user tries to close its window. If set to auto (default), DOSBox-X will warn if a DOS program, game or a guest system is currently running. If set to autofile, DOSBox-X will warn if there are open file handles or a guest system is currently running.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
        - autofile
      Workingdirectoryoption:
        Type: choice
        Description: "Select an option for DOSBox-X's working directory when it runs. autoprompt: DOSBox-X will auto-decide whether to prompt for a working directory. config: DOSBox-X will use the primary config file directory as the working directory. custom: Specify a working directory via the \"working directory default\" option. default: Similar to autoprompt, but DOSBox-X will ask whether to save the selected folder. force: Similar to \"custom\", while overriding -defaultdir command-line option if used. noprompt: DOSBox-X uses the current directory and never prompts for a working directory. program: DOSBox-X will use the DOSBox-X program directory as the working directory. prompt: DOSBox-X will always ask the user to select a working directory when it runs. userconfig: DOSBox-X will use its user configuration directory as the working directory."
        Default: default
        Choices:
        - autoprompt
        - config
        - custom
        - default
        - force
        - noprompt
        - program
        - prompt
        - userconfig
      Workingdirectorydefault:
        Type: string
        Description: The default directory to act as DOSBox-X's working directory. See also the setting "working directory option". For working directory option=prompt, the specified directory becomes the default directory for the folder selection.
      Showadvancedoptions:
        Type: bool
        Description: If set, the Configuration Tool will display all config options (including advanced ones) by default.
        Default: "false"
      Resolveconfigpath:
        Type: choice
        Description: If set to true, DOSBox-X will resolve options containing paths in the config file (except [autoexec] section). This includes environment variables (%VAR% [DOS/Windows] or ${VAR} [Linux/macOS] and tilde (~) in Linux/macOS. If set to dosvar, DOSBox-X forces to resolve DOS-style environment variables (%VAR%) in all platforms (and tilde). If set to tilde, DOSBox-X will only resolve tilde (~) in Linux/macOS but will not resolve environment variables.
        Default: "true"
        Choices:
        - "true"
        - "false"
        - dosvar
        - tilde
        - "1"
        - "0"
      Hostkey:
        Type: choice
        Description: By default, DOSBox-X uses the mapper-defined host key, which defaults to F11 on Windows and F12 on other platforms. You may alternatively specify a host key with this setting and bypass the host key as defined in the mapper. This can also be done from the menu ("Main" => "Select host key").
        Default: mapper
        Choices:
        - ctrlalt
        - ctrlshift
        - altshift
        - mapper
      Mappersendkey:
        Type: choice
        Description: Select the key the mapper SendKey function will send.
        Default: ctrlaltdel
        Choices:
        - winlogo
        - winmenu
        - alttab
        - ctrlesc
        - ctrlbreak
        - ctrlaltdel
      Ime:
        Type: choice
        Description: Enables support for the system input methods (IME) for inputting characters in Windows and Linux builds. If set to auto, this feature is only enabled if DOSBox-X starts with a Chinese/Japanese/Korean code page.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Synchronizetime:
        Type: bool
        Description: If set, DOSBox-X will try to automatically synchronize time with the host, unless you decide to change the date/time manually.
        Default: "false"
      Machine:
        Type: choice
        Description: The type of machine DOSBox-X tries to emulate.
        Default: svga_s3
        Choices:
        - mda
        - cga
        - cga_mono
        - cga_rgb
        - cga_composite
        - cga_composite2
        - hercules
        - hercules_plus
        - hercules_incolor
        - hercules_color
        - tandy
        - pcjr
        - pcjr_composite
        - pcjr_composite2
        - amstrad
        - olivetti
        - m24
        - att6300
        - pc3270
        - 3270pc
        - ega
        - ega200
        - jega
        - mcga
        - vgaonly
        - svga_s3
        - svga_s386c928
        - svga_s3vision864
        - svga_s3vision868
        - svga_s3vision964
        - svga_s3vision968
        - svga_s3trio32
        - svga_s3trio64
        - svga_s3trio64v+
        - svga_s3virge
        - svga_s3virgevx
        - svga_et3000
        - svga_et4000
        - svga_paradise
        - vesa_nolfb
        - vesa_oldvbe
        - vesa_oldvbe10
        - vesa_vbe3
        - pc98
        - pc9801
        - pc9821
        - svga_ati_egavgawonder
        - svga_ati_vgawonder
        - svga_ati_vgawonderplus
        - svga_ati_vgawonderxl
        - svga_ati_vgawonderxl24
        - svga_ati_mach8
        - svga_ati_mach32
        - svga_ati_mach64
        - svga_dosbox
        - svga_dosbox_vbe2
        - fm_towns
      Captures:
        Type: string
        Description: Directory where things like wave, midi, screenshot get captured.
        Default: capture
      Autosave:
        Type: string
        Description: Enable the auto-save state feature. Specify a time interval in seconds, and optionally a save slot or start and end save slots. For example, "autosave=10 11-20" will set a 10-second time interval for auto-saving, and the save slots used will be between 11 and 20. You can additionally specify up to 9 programs for this feature, e.g. "autosave=10 11-20 EDIT:21-30 EDITOR:35" for "EDIT" and "EDITOR". Putting a minus sign (-) before the time interval causes the auto-saving function to not be activated at start.
      Saveslot:
        Type: int
        Description: Select the default save slot (1-100) to save/load states.
        Default: "1"
      Savefile:
        Type: string
        Description: Select the default save file to save/load states. If specified it will be used instead of the save slot.
      Saveremark:
        Type: bool
        Description: If set, the save state feature will ask users to enter remarks when saving a state.
        Default: "true"
      Forceloadstate:
        Type: bool
        Description: If set, DOSBox-X will load a saved state even if it finds there is a mismatch in the DOSBox-X version, machine type, program name and/or the memory size.
        Default: "false"
      A20:
        Type: string
        Description: A20 gate emulation mode. The on/off/on_fake/off_fake options are intended for testing and debugging DOS development, or to emulate obscure hardware, or to work around potential extended memory problems with DOS programs. on_fake/off_fake are intended to test whether a program carries out a memory test to ensure the A20 gate is set as intended (as HIMEM.SYS does). If it goes by the gate bit alone, it WILL crash. This parameter is also changeable from the builtin A20GATE command. fast Emulate A20 gating by remapping the first 64KB @ 1MB boundary (fast, mainline DOSBox behavior) mask Emulate A20 gating by masking memory I/O address (accurate) off Lock A20 gate off (Software/OS cannot enable A20) on Lock A20 gate on (Software/OS cannot disable A20) off_fake Lock A20 gate off but allow bit to toggle (hope your DOS game tests the HMA!) on_fake Lock A20 gate on but allow bit to toggle
        Default: mask
      Memoryfile:
        Type: string
        Description: If set, guest memory is memory-mapped from a file on disk, rather than allocated from memory. This option can help keep DOSBox-X from consuming too much RAM for large values of memsize. This option is required to emulate 4GB or more of RAM. The file will be created if it does not exist and it does not require any special maintenance or formatting.
      Memsize:
        Type: int
        Description: Amount of memory DOSBox-X has in megabytes. This value is best left at its default to avoid problems with some games, although other games and applications may require a higher value. Programs that use 286 protected mode like Windows 3.0 in Standard Mode may crash with more than 15MB. A memory file is required to emulate a memory size of 4GB or more. The maximum value allowed is affected by the memalias setting which affects the maximum amount of memory CPU can access as a power of 2. The maximum value is also affected by the CPU type. See DOSBox-X console and log file for details. The maximum setting 1048576 represents 1TB and requires at least a Pentium II and PSE-40 emulation.
        Default: "16"
      Nocachedir:
        Type: bool
        Description: If set, MOUNT commands will mount with -nocachedir (disable directory caching) by default.
        Default: "false"
      Freesizecap:
        Type: choice
        Description: If set to "cap" (="true"), the value of MOUNT -freesize will apply only if the actual free size is greater than the specified value. If set to "relative", the value of MOUNT -freesize will change relative to the specified value. If set to "fixed" (="false"), the value of MOUNT -freesize will be a fixed one to be reported all the time.
        Default: cap
        Choices:
        - "true"
        - "false"
        - fixed
        - relative
        - cap
        - "2"
        - "1"
        - "0"
      Convertdrivefat:
        Type: bool
        Description: If set, DOSBox-X will auto-convert mounted non-FAT drives (such as local drives) to FAT format for use with guest systems.
        Default: "true"
  Cpu:
    DisplayName: CPU
    Description: |
      Core, emulated processor type and speed. 'cycles' is what most compatibility problems come down to: too many and an early game runs unplayably fast, too few and a late one crawls.
    Options:
      Core:
        Type: choice
        Description: CPU Core used in emulation. auto will switch to dynamic if available and appropriate. For the dynamic core, both dynamic_x86 and dynamic_rec are supported (dynamic_x86 is preferred). Windows 95 or other preemptive multitasking OSes will not work with the dynamic_rec core.
        Default: auto
        Choices:
        - auto
        - dynamic
        - dynamic_x86
        - dynamic_nodhfpu
        - dynamic_rec
        - normal
        - full
        - simple
      Fpu:
        Type: choice
        Description: Enable FPU emulation
        Default: "true"
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
        - "8087"
        - "287"
        - "387"
      Rdtscrate:
        Type: int
        Description: If nonzero, the Pentium RDTSC counter will tick at this rate per millisecond instead of by the cycle count
        Default: "0"
      Segmentlimits:
        Type: bool
        Description: Enforce checks for segment limits on 80286 and higher CPU types.
        Default: "true"
      Ldswraparound:
        Type: bool
        Description: For LDS/LES instructions, in 16-bit code, check for 64KB wraparound case.
        Default: "true"
      Cputype:
        Type: choice
        Description: CPU Type used in emulation. "auto" emulates a 486 which tolerates Pentium instructions. "experimental" enables newer instructions not normally found in the CPU types emulated by DOSBox-X, such as FISTTP.
        Default: auto
        Choices:
        - auto
        - "8086"
        - 8086_prefetch
        - "80186"
        - 80186_prefetch
        - "286"
        - 286_prefetch
        - "386"
        - 386_prefetch
        - 486old
        - 486old_prefetch
        - "486"
        - 486_prefetch
        - pentium
        - pentium_mmx
        - ppro_slow
        - pentium_ii
        - pentium_iii
        - experimental
      Cycles:
        Type: choice
        Description: "Number of instructions DOSBox-X tries to emulate each millisecond. Setting this value too high results in sound dropouts and lags. Cycles can be set in 3 ways: 'auto' tries to guess what a game needs. It usually works, but can fail for certain games. 'fixed #number' will set a fixed number of cycles. This is what you usually need if 'auto' fails (Example: fixed 4000). 'max' will allocate as much cycles as your computer is able to handle. Recommended if better performance is desired."
        Default: auto
        Choices:
        - auto
        - fixed
        - max
      Cycleup:
        Type: int
        Description: Amount of cycles to decrease/increase with the mapped keyboard shortcut.
        Default: "10"
      Cycledown:
        Type: int
        Description: Setting it lower than 100 will be a percentage.
        Default: "20"
      Turbo:
        Type: bool
        Description: Enables Turbo (Fast Forward) mode to speed up operations.
        Default: "false"
      Apmbios:
        Type: bool
        Description: Emulate Advanced Power Management (APM) BIOS calls.
        Default: "true"
      Integrationdevice:
        Type: bool
        Description: Enable DOSBox-X's integration I/O device, a way for additional software to talk to DOSBox-X. It is currently experimental. This can for example be used to return DOSBox-X's current status and by the guest OS to match the mouse pointer position.
        Default: "false"
      Isapnpbios:
        Type: bool
        Description: Emulate ISA Plug & Play BIOS. Enable if using DOSBox-X to run a PnP aware DOS program or if booting Windows 9x. Do not disable if Windows 9x is configured around PnP devices, you will likely confuse it.
        Default: "true"
  Video:
    DisplayName: Video Memory and VESA
    Description: How much video memory is reported, and which VESA BIOS modes are offered.
    Options:
      Vbememsize:
        Type: int
        Description: Amount of video memory in kilobytes to report through the VESA BIOS extensions. Set this value to an amount lower than vmemsize to handle DOS programs that cannot handle more than the small amount of video memory they were designed for. This option also affects what video modes are reported through the VBE.
        Default: "0"
      Vbememsizekb:
        Type: int
        Description: Amount of video memory to report in kilobytes, in addition to vbememsize.
        Default: "0"
      Vmemsize:
        Type: int
        Description: "Amount of video memory in megabytes. The maximum resolution and color depth the svga_s3 will be able to display is determined by this value. -1: auto (vmemsizekb is ignored) 0: 512k (800x600 at 256 colors) if vmemsizekb=0 1: 1024x768 at 256 colors or 800x600 at 64k colors 2: 1600x1200 at 256 colors or 1024x768 at 64k colors or 640x480 at 16M colors 4: 1600x1200 at 64k colors or 1024x768 at 16M colors 8: up to 1600x1200 at 16M colors Larger values are available depending on machine type. For build engine games, use more memory than in the list above so it can use triple buffering and thus won't flicker."
        Default: "-1"
      Vmemsizekb:
        Type: int
        Description: Amount of video memory in kilobytes, in addition to vmemsize.
        Default: "0"
      Highintensityblinking:
        Type: bool
        Description: Set to false if you want to see high-intensity background colors instead of blinking foreground text. This option has no effect in PC-98 and some other video modes.
        Default: "true"
      Memoryiooptimization1:
        Type: bool
        Description: Enable one class of EGA/VGA memory I/O optimizations. Default ON (true). If graphical artifacts or errors occur, try turning this off first. May provide a performance benefit.
        Default: "true"
      Skiprenderifnothingchanged:
        Type: choice
        Description: If set, DOSBox-X will skip rendering entirely unless any change is made to the guest display. This may provide a performance benefit, especially in SVGA modes. This option has no effect unless render on demand is true or auto. Normally in DOSBox and DOSBox-X, video is rendered constantly, whether or not anything changed, and then compared with the previous frame to determine where to update the host display. In addition to the render on demand option, this option may further break timing dependent effects and/or cause problems with some games.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Scanlinerenderondemand:
        Type: choice
        Description: Render video output at vsync or when something is changed mid frame, instead of stopping to render every scanline. This may provide a performance benefit to most DOS games. However this may also break timing-dependent game or Demoscene effects. Default is auto, which will turn it off for VGA modes and turn it on for SVGA modes.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
  Vsync:
    DisplayName: Vertical Sync
    Options:
      Vsyncmode:
        Type: choice
        Description: Synchronize vsync timing to the host display. Requires calibration within DOSBox-X.
        Default: "off"
        Choices:
        - "off"
        - "on"
        - force
        - host
      Vsyncrate:
        Type: int
        Description: Vsync rate used if vsync is enabled. Ignored if vsyncmode is set to host (win32).
        Default: "75"
  Keyboard:
    DisplayName: Keyboard Hardware
    Description: Emulated keyboard controller behaviour, not the host key mapping.
    Options:
      Aux:
        Type: bool
        Description: Enable emulation of the 8042 auxiliary port. PS/2 mouse emulation requires this to be enabled. You should enable this if you will be running Windows ME or any other OS that does not use the BIOS to receive mouse events.
        Default: "true"
      Allowoutputportreset:
        Type: bool
        Description: If set (default), allow the application to reset the CPU through the keyboard controller. This option is required to allow Windows ME to reboot properly, whereas Windows 9x and earlier will reboot without this option using INT 19h
        Default: "true"
      Controllertype:
        Type: choice
        Description: Type of keyboard controller (and keyboard) attached. auto Automatically pick according to machine type at AT (PS/2) type keyboard xt IBM PC/XT type keyboard pcjr IBM PCjr type keyboard (only if machine=pcjr) pc98 PC-98 keyboard emulation (only if machine=pc98)
        Default: auto
        Choices:
        - auto
        - at
        - xt
        - pcjr
        - pc98
      Auxdevice:
        Type: choice
        Description: Type of PS/2 mouse attached to the AUX port
        Default: intellimouse
        Choices:
        - none
        - 2button
        - 3button
        - intellimouse
        - intellimouse45
  Joystick:
    DisplayName: Joystick
    Description: Which game port device is emulated and how the host controller maps onto it.
    Options:
      Joysticktype:
        Type: choice
        Description: "Type of joystick to emulate: auto (default), none (disables joystick emulation), 2axis (supports two joysticks), 4axis (supports one joystick, first joystick used), 4axis_2 (supports one joystick, second joystick used), fcs (Thrustmaster), ch (CH Flightstick). auto chooses emulation depending on real joystick(s). (Remember to reset DOSBox-X's mapperfile if you saved it earlier)"
        Default: auto
        Choices:
        - auto
        - 2axis
        - 4axis
        - 4axis_2
        - fcs
        - ch
        - none
      Timed:
        Type: bool
        Description: enable timed intervals for axis. Experiment with this option, if your joystick drifts (away).
        Default: "true"
      Autofire:
        Type: bool
        Description: continuously fires as long as you keep the button pressed.
        Default: "false"
      Swap34:
        Type: bool
        Description: swap the 3rd and the 4th axis. can be useful for certain joysticks.
        Default: "false"
      Buttonwrap:
        Type: bool
        Description: enable button wrapping at the number of emulated buttons.
        Default: "false"
  Mapper:
    DisplayName: Joystick Deadzones
    Description: |
      Per-axis deadzones for the first two host joysticks. Upstream names these keys joy1deadzone0- and joy1deadzone0+, which both reduce to the same option key once sanitised, so one option here covers both directions of an axis.
    Options:
      Joy1deadzone0_:
        Type: string
        Description: deadzone for joystick 1 axis 0-
        Default: "0.60"
      Joy1deadzone1_:
        Type: string
        Description: deadzone for joystick 1 axis 1-
        Default: "0.60"
      Joy1deadzone2_:
        Type: string
        Description: deadzone for joystick 1 axis 2-
        Default: "0.60"
      Joy1deadzone3_:
        Type: string
        Description: deadzone for joystick 1 axis 3-
        Default: "0.60"
      Joy1deadzone4_:
        Type: string
        Description: deadzone for joystick 1 axis 4-
        Default: "0.60"
      Joy1deadzone5_:
        Type: string
        Description: deadzone for joystick 1 axis 5-
        Default: "0.60"
      Joy1deadzone6_:
        Type: string
        Description: deadzone for joystick 1 axis 6-
        Default: "0.60"
      Joy1deadzone7_:
        Type: string
        Description: deadzone for joystick 1 axis 7-
        Default: "0.60"
      Joy2deadzone0_:
        Type: string
        Description: deadzone for joystick 2 axis 0-
        Default: "0.60"
      Joy2deadzone1_:
        Type: string
        Description: deadzone for joystick 2 axis 1-
        Default: "0.60"
      Joy2deadzone2_:
        Type: string
        Description: deadzone for joystick 2 axis 2-
        Default: "0.60"
      Joy2deadzone3_:
        Type: string
        Description: deadzone for joystick 2 axis 3-
        Default: "0.60"
      Joy2deadzone4_:
        Type: string
        Description: deadzone for joystick 2 axis 4-
        Default: "0.60"
      Joy2deadzone5_:
        Type: string
        Description: deadzone for joystick 2 axis 5-
        Default: "0.60"
      Joy2deadzone6_:
        Type: string
        Description: deadzone for joystick 2 axis 6-
        Default: "0.60"
      Joy2deadzone7_:
        Type: string
        Description: deadzone for joystick 2 axis 7-
        Default: "0.60"
  Mixer:
    DisplayName: Audio Mixer
    Description: Sample rate, buffer size and overall audio behaviour.
    Options:
      Nosound:
        Type: bool
        Description: Enable silent mode, sound is still emulated though.
        Default: "false"
      Dcbiascorrection:
        Type: bool
        Description: If set, apply DC bias correction to the overall audio mix to prevent distortion when certain DOS gamesplay digitized audio where the digitized audio has an overall DC bias that is way off from zero, for example,In Extremis. This is enabled by default. The bias correction is applied slowly so that normal audio outputremains unaffected
        Default: "true"
      Sampleaccurate:
        Type: bool
        Description: Enable sample accurate mixing, at the expense of some emulation performance. Enable this option for DOS games and demos that require such accuracy for correct Tandy/OPL output including digitized speech. This option can also help eliminate minor errors in Gravis Ultrasound emulation that result in random echo/attenuation effects.
        Default: "false"
      Swapstereo:
        Type: bool
        Description: Swaps the left and right stereo channels.
        Default: "false"
      Rate:
        Type: int
        Description: Mixer sample rate, setting any device's rate higher than this will probably lower their sound quality.
        Default: "48000"
      Blocksize:
        Type: choice
        Description: Mixer block size, larger blocks might help sound stuttering but sound will also be more lagged.
        Default: "1024"
        Choices:
        - "1024"
        - "2048"
        - "4096"
        - "8192"
        - "512"
        - "256"
      Prebuffer:
        Type: int
        Description: How many milliseconds of data to keep on top of the blocksize.
        Default: "25"
  Sblaster:
    DisplayName: Sound Blaster
    Description: |
      The card most DOS games expect. sbtype, sbbase, irq and dma must match what the game's own setup program was told, or it will find no sound card at all.
    Options:
      Sbtype:
        Type: choice
        Description: Type of Sound Blaster to emulate. 'gb' is Game Blaster.
        Default: sb16
        Choices:
        - sb1
        - sb1.0
        - sb1.5
        - sb2
        - sb2.0
        - sb2.01
        - sbpro1
        - sbpro2
        - sb16
        - sb16vibra
        - gb
        - ess688
        - ess1688
        - reveal_sc400
        - none
      Sbbase:
        Type: choice
        Description: The IO address of the Sound Blaster. 220h to 2E0h are for use with IBM PC Sound Blaster emulation. D2h to DEh are for use with NEC PC-98 Sound Blaster 16 emulation.
        Default: "220"
        Choices:
        - "220"
        - "240"
        - "260"
        - "280"
        - 2a0
        - 2c0
        - "2e0"
        - d2
        - d4
        - d6
        - d8
        - da
        - dc
        - de
      Irq:
        Type: choice
        Description: The IRQ number of the Sound Blaster (usually 5 or 7, depending on the sound card type and the game). Set to 0 for the default setting of the sound card, or set to -1 to start DOSBox-X with the IRQ unassigned.
        Default: "7"
        Choices:
        - "7"
        - "5"
        - "3"
        - "9"
        - "10"
        - "11"
        - "12"
        - "0"
        - "-1"
      Listentorecordingsource:
        Type: bool
        Description: When the guest records audio from the Sound Blaster card, send the input source to the speakers as well so it can be heard.
        Default: "false"
      Recordingsource:
        Type: choice
        Description: 'Audio source to use when guest is recording audio. Options: silence, hiss, 1khz tone, or microphone (Windows WASAPI input).'
        Default: silence
        Choices:
        - silence
        - hiss
        - 1khz tone
        - microphone
      Preferhfp:
        Type: bool
        Description: Prefer Bluetooth HFP (Hands-Free Profile) microphone mode. This allows using the microphone of a BT headset but reduces audio quality (typically 8kHz–16kHz telephone quality). When disabled, higher-quality microphones are preferred.
        Default: "false"
      Dma:
        Type: choice
        Description: The DMA number of the Sound Blaster. Set to -1 to start DOSBox-X with the DMA unassigned.
        Default: "1"
        Choices:
        - "1"
        - "5"
        - "0"
        - "3"
        - "6"
        - "7"
        - "-1"
      Hdma:
        Type: choice
        Description: The High DMA number of the Sound Blaster. Set to -1 to start DOSBox-X with the High DMA unassigned.
        Default: "5"
        Choices:
        - "1"
        - "5"
        - "0"
        - "3"
        - "6"
        - "7"
        - "-1"
      Enablespeaker:
        Type: bool
        Description: Start the DOS virtual machine with the Sound Blaster speaker enabled. Sound Blaster Pro and older cards have a speaker disable/enable command. Normally the card boots up with the speaker disabled. If a DOS game or demo attempts to play without enabling the speaker, set this option to true to compensate. This setting has no meaning if emulating a Sound Blaster 16 card.
        Default: "false"
      Sbmixer:
        Type: bool
        Description: Allow the Sound Blaster mixer to modify the DOSBox-X mixer.
        Default: "true"
      Oplmode:
        Type: choice
        Description: Type of OPL emulation. On 'auto' the mode is determined by the 'sbtype' setting. All OPL modes are AdLib-compatible.
        Default: auto
        Choices:
        - auto
        - opl2
        - dualopl2
        - opl3
        - opl3gold
        - none
        - hardware
        - hardwaregb
        - esfm
      Oplemu:
        Type: choice
        Description: Provider for the OPL emulation. 'compat' might provide better quality. 'nuked' is the most accurate (but the most CPU-intensive). See oplrate as well.
        Default: default
        Choices:
        - default
        - compat
        - fast
        - nuked
        - mame
        - opl2board
        - opl3duoboard
        - retrowave_opl3
        - esfmu
        - cqm
      Oplrate:
        Type: choice
        Description: Sample rate of OPL music emulation. Use 49716 for highest quality (set the mixer rate accordingly).
        Default: "49716"
        Choices:
        - "49716"
        - "48000"
        - "44100"
        - "32000"
        - "22050"
        - "16000"
        - "11025"
        - "8000"
      Oplport:
        Type: string
        Description: Serial port of the OPL2 Audio Board when oplemu=opl2board, opl2mode will become 'opl2' automatically.
      Retrowave_bus:
        Type: string
        Description: Bus of the Retrowave series board (serial/spi). SPI is only supported on Linux.
        Default: serial
      Retrowave_port:
        Type: string
        Description: Serial port of the Retrowave series board.
      Hardwarebase:
        Type: int
        Description: 'base address of the real hardware Sound Blaster: 210,220,230,240,250,260,280'
        Default: "220"
      Goldplay:
        Type: bool
        Description: Enable goldplay emulation.
        Default: "true"
      Blasterenvironmentvariable:
        Type: bool
        Description: Whether or not to set the BLASTER environment variable automatically at startup
        Default: "true"
