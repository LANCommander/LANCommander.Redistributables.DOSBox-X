  Gus:
    DisplayName: Gravis Ultrasound
    Options:
      Gus:
        Type: bool
        Description: Enable the Gravis Ultrasound emulation.
        Default: "false"
      Globalregisterreadalias:
        Type: choice
        Description: If true, all GUS global registers have a read alias at N and N+0x80. If false, only the voice registers 0x0-0xF have a read alias at 0x80-0x8F as officially documented. If auto, automatically choose based on other settings such as GUS type. This setting may be needed for DOS demoscene entries that assume aliasing behavior such as Out of Control by Contract.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Gusrate:
        Type: choice
        Description: Sample rate of Ultrasound emulation.
        Default: "48000"
        Choices:
        - "49716"
        - "48000"
        - "44100"
        - "32000"
        - "22050"
        - "16000"
        - "11025"
        - "8000"
      Gusmemsize:
        Type: int
        Description: Amount of RAM on the Gravis Ultrasound in KB. Set to -1 for default.
        Default: "-1"
      Gusmastervolume:
        Type: string
        Description: Master Gravis Ultrasound GF1 volume, in decibels. Reducing the master volume can help with games or demoscene productions where the music is too loud and clipping.
        Default: "0.00"
      Gusbase:
        Type: choice
        Description: The IO base address of the Gravis Ultrasound.
        Default: "240"
        Choices:
        - "240"
        - "220"
        - "260"
        - "280"
        - 2a0
        - 2c0
        - "2e0"
        - "300"
        - "210"
        - "230"
        - "250"
      Gusirq:
        Type: choice
        Description: The IRQ number of the Gravis Ultrasound.
        Default: "5"
        Choices:
        - "5"
        - "3"
        - "7"
        - "9"
        - "10"
        - "11"
        - "12"
      Gusdma:
        Type: choice
        Description: The DMA channel of the Gravis Ultrasound.
        Default: "3"
        Choices:
        - "3"
        - "0"
        - "1"
        - "5"
        - "6"
        - "7"
      Gustype:
        Type: choice
        Description: Type of Gravis Ultrasound to emulate. classic Original Gravis Ultrasound chipset classic37 Original Gravis Ultrasound with ICS Mixer (rev 3.7) max Gravis Ultrasound MAX emulation (with CS4231 codec) interwave Gravis Ultrasound Plug & Play (interwave)
