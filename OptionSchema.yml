      Phonebookfile:
        Type: string
        Description: File used to map fake phone numbers to addresses.
        Default: phonebook-dosbox-x.txt
  Parallel:
    DisplayName: Parallel Ports
    Options:
      Parallel1:
        Type: string
        Description: "parallel1-9 -- set type of device connected to the parallel (LPT) port. Can be: reallpt (direct parallel port passthrough), file (records data to a file or passes it to a device), printer (virtual dot-matrix printer, see [printer] section) disney (attach Disney Sound Source emulation to this port) Additional parameters must be in the same line in the form of parameter:value. for reallpt: Windows and DOS: realbase (the base address of your real parallel port). Default: 378 ecpbase (address of the ECP Extended Control register, optional). BSD: same as Windows (requires root access / setuid root). Linux: same as Windows (requires root access / setuid root) or: realport (the parallel port device e.g. /dev/parport0). for file: dev:<devname> (i.e. dev:lpt1) to forward data to a device, or append:<file> appends data to the specified file. Without the above parameters data is written to files in the capture dir. Additional parameters: timeout:<milliseconds> = how long to wait before closing the file on inactivity (default:0 or 500), squote to use single quotes instead of double quotes for quoted program commands. shellhide to hide the command window when opening programs on the Windows platform. addFF to add a formfeed when closing, addLF to add a linefeed if the app doesn't. cp:<codepage number> to perform codepage translation, i.e. cp:437 openps:<program>: start a program to open the file if the print output is detected to be PostScript. openpcl:<program>: start a program to open the file if the print output is detected to be PCL. openwith:<program>: start a program to open the file in all other conditions. openerror:<program>: start a program to open the file if an error had occurred. Example: parallel1=file file:output1.prn timeout:1000 openpcl:pcl6 openps:gswin32c openwith:notepad for printer: printer still has its own configuration section above. Note: LPT1-3 are standard LPT ports in DOS, whereas LPT4-9 are extended LPT ports. You can optionally specify base addresses and IRQs for them with base: and irq: options. Parallel port settings can also be changed via the built-in PARALLEL command."
        Default: printer
      Parallel2:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel3:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel4:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel5:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel6:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel7:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel8:
        Type: string
        Description: see parallel1
        Default: disabled
      Parallel9:
        Type: string
        Description: see parallel1
        Default: disabled
      Dongle:
        Type: bool
        Description: Enable dongle
        Default: "false"
  Printer:
    DisplayName: Printer Emulation
    Options:
      Printer:
        Type: bool
        Description: Enable printer emulation. Send to an actual printer in Windows (specify a printer, or Print dialog will appear)
        Default: "true"
      Dpi:
        Type: int
        Description: Resolution of printer (default 360).
        Default: "360"
      Width:
        Type: int
        Description: Width of paper in 1/10 inch (default 85 = 8.5'').
        Default: "85"
      Height:
        Type: int
        Description: Height of paper in 1/10 inch (default 110 = 11.0'').
        Default: "110"
      Printoutput:
        Type: string
        Description: 'Output method for finished pages: png : Creates PNG images (default) ps : Creates PostScript bmp : Creates BMP images (very huge files, not recommended)'
        Default: png
      Multipage:
        Type: bool
        Description: Adds all pages to one PostScript file or printer job until CTRL-F2 is pressed.
        Default: "false"
      Device:
        Type: string
        Description: Specify the Windows printer device to use. You can see the list of devices from the Help menu ('List printer devices') or the Status Window. Then make your choice and put either the printer device number (e.g. 2) or your printer name (e.g. Microsoft Print to PDF). Leaving it empty will show the Windows Print dialog (or '-' for showing once).
        Default: '-'
      Docpath:
        Type: string
        Description: The path (directory) where the output files are stored.
        Default: .
      Fontpath:
        Type: string
        Description: The path (directory) where the printer fonts (courier.ttf, ocra.ttf, roman.ttf, sansserif.ttf, script.ttf) are located.
        Default: FONTS
      Openwith:
        Type: string
        Description: Start the specified program to open the output file.
      Openerror:
        Type: string
        Description: Start the specified program to open the output file if an error had occurred.
      Printdbcs:
        Type: choice
        Description: 'Allows DOSBox-X to print Chinese/Japanese/Korean DBCS (double-byte) characters when these code pages are active. If set to auto (default), this is enabled only for the TrueType font (TTF) output with the DBCS support enabled. Only applicable when using a DBCS code page (932: Japanese, 936: Simplified Chinese; 949: Korean; 950: Traditional Chinese)'
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Shellhide:
        Type: bool
        Description: If set, the command window will be hidden for openwith/openerror options on the Windows platform.
        Default: "false"
      Timeout:
        Type: int
        Description: '(in milliseconds) if nonzero: the time the page will be ejected automatically after when no more data arrives at the printer.'
        Default: "0"
  Dos:
    DisplayName: DOS Environment
    Description: |
      The DOS the game sees: reported version, memory managers, long filename support and keyboard layout.
    Options:
      Xms:
        Type: bool
        Description: Enable XMS support.
        Default: "true"
      Breakonint3:
        Type: bool
        Description: If set, a breakpoint on INT 3 is automatically set up at startup
        Default: "false"
      Xmshandles:
        Type: int
        Description: Number of XMS handles available for the DOS environment, or 0 to use a reasonable default
        Default: "0"
      Shellconfigurationascommands:
        Type: bool
        Description: Allow entering dosbox-x.conf configuration parameters as shell commands to get and set settings. This is disabled by default to avoid conflicts between commands and executables. It is recommended to get and set dosbox-x.conf settings using the CONFIG command instead. Compatibility with DOSBox SVN can be improved by enabling this option.
        Default: "false"
      Hma:
        Type: bool
        Description: Report through XMS that HMA exists (not necessarily available)
        Default: "true"
      Harddrivedataratelimit:
        Type: int
        Description: Slow down (limit) hard disk throughput. This setting controls the limit in bytes/second. Set to 0 to disable the limit, or -1 (default) to use a reasonable limit. The disk I/O performance as in DOSBox SVN can be achieved by setting this to 0.
        Default: "-1"
      Floppydrivedataratelimit:
        Type: int
        Description: Slow down (limit) floppy disk throughput. This setting controls the limit in bytes/second. Set to 0 to disable the limit, or -1 (default) to use a reasonable limit. The disk I/O performance as in DOSBox SVN can be achieved by setting this to 0.
        Default: "-1"
      Ansi_sys:
        Type: bool
        Description: 'If set (by default), ANSI.SYS emulation is on. If clear, ANSI.SYS is not emulated and will not appear to be installed. NOTE: This option has no effect in PC-98 mode where MS-DOS systems integrate ANSI.SYS into the DOS kernel.'
        Default: "true"
      Logconsole:
        Type: choice
        Description: If set, log DOS CON output to the log file. Setting to "quiet" will log DOS CON output only (no debugging output).
        Default: "false"
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - quiet
      Share:
        Type: bool
        Description: Reports SHARE.EXE as resident and provides functions such as file-locking and record-locking, although not all SHARE functions are emulated.
        Default: "true"
      Fileaccesstries:
        Type: int
        Description: If a positive integer is set, DOSBox-X will try to read/write/lock files directly on mounted local drives for the specified number of times without caching before failing on Windows systems. For networked database applications (e.g. dBase, FoxPro, etc), it is strongly recommended to set this to e.g. 3 for correct operations.
        Default: "0"
      Networkredirector:
        Type: bool
        Description: Report DOS network redirector as resident. This will allow the host name to be returned unless the secure mode is enabled. You can also directly access UNC network paths in the form \\MACHINE\SHARE even if they are not mounted as drives on Windows systems. Set either "ipx=true" in [ipx] section or "ne2000=true" in [ne2000] section for a full network redirector environment.
        Default: "true"
      Mcbcorruptionbecomesapplicationfreememory:
        Type: bool
        Description: If MCB chain corruption occurs following the DOS program PSP segment and the DOS program does anything to cause memory allocation,make a new free memory block in it's place instead of halting emulation with an MCB chain error. Some DOS programs are sloppywith memory to corrupt the MCB chain after itself in memory. This is apparently real MS-DOS behavior, set to true to enable.If set to false, all MCB chain corruption will halt emulation as DOSBox forks typically do already.
        Default: "false"
      Minimummcbfree:
        Type: int
        Description: Minimum free segment value to leave free. At startup, the DOS kernel will allocate memory up to this point. This can be used to deal with EXEPACK issues or DOS programs that cannot be loaded too low in memory. If you want more free conventional memory to be reported, you can for example set its value to 1.
        Default: "0"
      Ems:
        Type: choice
        Description: Enable EMS support. The default (=true) provides the best compatibility but certain applications may run better with other choices, or require EMS support to be disabled (=false) to work at all.
        Default: "true"
        Choices:
        - "true"
        - emsboard
        - emm386
        - "false"
        - "1"
        - "0"
      Umb:
        Type: bool
        Description: Enable UMB support.
        Default: "true"
      Quickreboot:
        Type: bool
        Description: If set, the DOS restart call will reboot the emulated DOS (integrated DOS or guest DOS) instead of the virtual machine.
        Default: "false"
      Ver:
        Type: string
        Description: 'Set DOS version. Specify as major.minor format. A single number is treated as the major version (compatible with LFN support). Common settings are: auto (or unset) Pick DOS kernel version 5.0 (DOSBox default) 3.3 MS-DOS 3.3 emulation (not tested!) 5.0 MS-DOS 5.0 emulation (recommended for DOS gaming) 6.22 MS-DOS 6.22 emulation 7.0 MS-DOS 7.0 (or Windows 95 pure DOS mode) emulation 7.1 MS-DOS 7.1 (or Windows 98 pure DOS mode) emulation Long filename (LFN) support will be enabled with a reported DOS version of 7.0 or higher with "lfn=auto" (default). Similarly, FAT32 disk images will be supported with a reported DOS version of 7.1 or higher.'
      Lfn:
        Type: choice
        Description: Enable long filename support. If set to auto (default), LFN support is enabled if the reported DOS version is at least 7.0. If set to autostart, the built-in VER command won't activate/deactivate LFN support according to the reported DOS version.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
        - autostart
      Fat32setversion:
        Type: choice
        Description: Whether DOSBox-X should automatically set the reported DOS version to 7.0/7.10 when it is less than 7.0/7.10 and mounting LBA/FAT32 disk images is requested. If set to "ask", a popup message will show up to ask whether DOSBox-X should automatically change the reported DOS version in order to mount the disk image.
        Default: ask
        Choices:
        - ask
        - auto
        - manual
      Shellhigh:
        Type: choice
        Description: Load the DOSBox-X command shell into the upper memory when the UMB is available. If set to auto (default), it is enabled if the reported DOS version is at least 7.0.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Automount:
        Type: bool
        Description: Enable automatic drive mounting in Windows.
        Default: "true"
      Automountall:
        Type: choice
        Description: Automatically mount all available Windows drives at start.
        Default: "false"
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - quiet
      Mountwarning:
        Type: bool
        Description: If set, a warning message will be displayed while trying to auto-mount your Windows host drives.
        Default: "true"
      Autofixwarning:
        Type: choice
        Description: If set to true or both, DOSBox-X shows messages while trying to automatically fix the "Packed file is corrupt" error. If set to false or none, DOSBox-X will not show such messages on the screen when the error occurred. If set to "a20fix" or "loadfix", DOSBox-X will show the message for the a20fix or the loadfix only.
        Default: "false"
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - both
        - a20fix
        - loadfix
        - none
      Startcmd:
        Type: bool
        Description: Enable START command to start programs to run on the host system. On Windows host programs or commands may also be launched directly.
        Default: "false"
      Starttranspath:
        Type: bool
        Description: Specify whether DOSBox-X should automatically translate all paths in the command-line to host system paths when starting programs to run on the host system.
        Default: "true"
      Startwait:
        Type: bool
        Description: Specify whether DOSBox-X should wait for the host system applications after they are started.
        Default: "true"
      Startquiet:
        Type: bool
        Description: If set, before launching host system applications to run on the host DOSBox-X will not show messages like "Now run it as a Windows application".
        Default: "false"
      Startnopause:
        Type: bool
        Description: If set, DOSBox-X will not pause after host command execution is completed.
        Default: "false"
      Vmware:
        Type: bool
        Description: Enable VMware interface emulation including guest mouse integration (when used along with e.g. VMware mouse driver for Windows 3.x).
        Default: "true"
      Int33:
        Type: bool
        Description: Enable INT 33H for mouse support.
        Default: "true"
      Mousereportrate:
        Type: int
        Description: Mouse reporting rate, or 0 for auto. This affects how often mouse events are reported to the guest through the mouse interrupt. Some games including CyClone need a lower reporting rate to function correctly. Auto mode allows the guest to change the report rate through the PS/2 mouse emulation. This option does not affect any DOS game that uses polling through INT 33h to detect mouse movement.
        Default: "0"
      Keyboardlayout:
        Type: string
        Description: Language code of the keyboard layout (or none).
        Default: auto
      Customcodepage:
        Type: string
        Description: 'Set a custom code page for CHCP command and specify a SBCS code page file, following the standard SBCS code page format. Examples of SBCS code pages are available from the Unicode Consortium website: https://www.unicode.org/Public/MAPPINGS/VENDORS/MICSFT/PC/'
      Dbcs:
        Type: bool
        Description: 'Enable DBCS table and Chinese, Japanese, Korean support for the TrueType font (TTF) output. CAUTION: Some software will crash without the DBCS table, including the Open Watcom installer.'
        Default: "true"
      Dosclipboarddeviceenable:
        Type: bool
        Description: If enabled, a DOS device will be added for bidirectional communications with the shared clipboard. Setting to "read" will only allow read access, and setting to "write" will only allow write access. Setting to "full" or "true" enables both; setting to "false" or "disabled" disables the access or device. The default device name is CLIP$, but can be changed with the "dos clipboard device name" setting below.
        Default: "false"
      Dosclipboarddevicename:
        Type: string
        Description: Set DOS device name (up to 8 characters) for bidirectional communications with the shared clipboard. If unset or invalid, the default name CLIP$ will be used (e.g. "TYPE CLIP$" shows the clipboard contents). It has no effect if "dos clipboard device enable" is disabled, and it is deactivated if the secure mode is enabled.
        Default: CLIP$
      Dosclipboardapi:
        Type: bool
        Description: 'If set, DOS APIs for communications with the Windows clipboard will be enabled for shared clipboard communications. Caution: Enabling this API may cause some programs to think they are running under Windows'
        Default: "false"
      Dosidleapi:
        Type: bool
        Description: If set, DOSBox-X can lower the host system's CPU load when a supported guest program is idle.
        Default: "true"
  Config:
    DisplayName: CONFIG.SYS
    Description: |
      The emulated machine's CONFIG.SYS. Upstream documents only some of these keys, so a few arrive without a description.
    Options:
      Rem:
        Type: string
        Description: Records comments (remarks).
        Default: This section is DOS's CONFIG.SYS file, not all CONFIG.SYS options supported
      Break:
        Type: choice
        Description: Sets or clears extended CTRL+C checking.
        Default: "off"
        Choices:
        - "on"
        - "off"
      Numlock:
        Type: choice
        Description: Sets the initial state of the NumLock key.
        Choices:
        - "on"
        - "off"
      Shell:
        Type: string
        Description: Specifies the command shell (COMMAND.COM or 4DOS.COM).
      Dos:
        Type: string
        Description: Reports whether DOS occupies HMA and allocates UMB memory (if available).
        Default: high, umb
      Fcbs:
        Type: int
        Description: Number of FCB handles available to DOS programs (1-255). Set to 0 to automatically use a reasonable default.
        Default: "0"
      Files:
        Type: int
        Description: Number of file handles available to DOS programs (8-255). Set to 0 to automatically use a reasonable default.
        Default: "0"
      Country:
        Type: string
        Description: Country code for date/time/decimal formats and optionally code page for TTF output and language files.
      Lastdrive:
        Type: choice
        Description: The maximum drive letter (A-Z) that can be accessed by programs.
        Default: a
        Choices:
        - a
        - b
        - c
        - d
        - e
        - f
        - g
        - h
        - i
        - j
        - k
        - l
        - m
        - "n"
        - o
        - p
        - q
        - r
        - s
        - t
        - u
        - v
        - w
        - x
        - "y"
        - z
      Setpath:
        Type: string
        Default: Z:\;Z:\SYSTEM;Z:\BIN;Z:\DOS;Z:\4DOS;Z:\DEBUG;Z:\TEXTUTIL
      Setprompt:
        Type: string
        Default: $P$G
      Settemp:
        Type: string
      Install:
        Type: string
      Installhigh:
        Type: string
      Device:
        Type: string
      Devicehigh:
        Type: string
  4dos:
    DisplayName: 4DOS Shell
    Options:
      Rem:
        Type: string
        Default: This section is the 4DOS.INI file, if you use 4DOS as the command shell
  Ttf:
    DisplayName: TrueType Output
    Description: |
      Settings for output=ttf, which renders DOS text with a real font instead of the hardware character generator. Note that the CJK fonts are not packaged -- see the README.
    Options:
      Font:
        Type: string
        Description: Specifies a TrueType font to use for the TTF output. If not specified, the built-in TrueType font will be used. Either a font name or full font path can be specified. If file ends with the .TTF extension then the extension can be omitted. For a font name or relative path, directories such as the working directory and default system font directory will be searched. For example, setting it to "consola" or "consola.ttf" will use Consola font (included in Windows); similar for other TTF fonts. Additionally, OTF fonts (e.g. OratorStd.otf), .FON fonts (e.g. vgasys.fon), and .TTC fonts (e.g. msgothic.ttc) are also supported. To display Chinese/Japanese/Korean text in these code pages, a font with CJK characters is needed (e.g. GNU Unifont or Sarasa Gothic).
      Fontbold:
        Type: string
        Description: You can optionally specify a bold TrueType font for use with the TTF output that will render the bold text style. It requires a word processor be set with the wp option, and this actual bold font will be used for the bold style. For example, setting it to "consolab" or "consolab.ttf" will use the Consolab font; similar for other TTF fonts.
      Fontital:
        Type: string
        Description: You can optionally specify an italic TrueType font for use with the TTF output that will render the italic text style. It requires a word processor be set with the wp option, and this actual italic font will be used for the italic style. For example, setting it to "consolai" or "consolai.ttf" will use the Consolai font; similar for other TTF fonts.
      Fontboit:
        Type: string
        Description: You can optionally specify a bold italic TrueType font for use with the TTF output that will render the bold italic text style. It requires a word processor be set with the wp option, and this actual bold-italic font will be used for the bold-italic style. For example, setting it to "consolaz" or "consolaz.ttf" will use the Consolaz font; similar for other TTF fonts.
      Colors:
        Type: string
        Description: 'Specifies a color scheme to use for the TTF output by supply all 16 color values in RGB: (r,g,b) or hexadecimal as in HTML: #RRGGBB The original DOS colors (0-15): #000000 #0000aa #00aa00 #00aaaa #aa0000 #aa00aa #aa5500 #aaaaaa #555555 #5555ff #55ff55 #55ffff #ff5555 #ff55ff #ffff55 #ffffff gray scaled color scheme: (0,0,0) #0e0e0e (75,75,75) (89,89,89) (38,38,38) (52,52,52) #717171 #c0c0c0 #808080 (28,28,28) (150,150,150) (178,178,178) (76,76,76) (104,104,104) (226,226,226) (255,255,255) An optional leading "+" sign allows the preset color scheme to be used when switching from another output.'
      Outputswitch:
        Type: choice
        Description: Specifies the output that DOSBox-X should switch to from the TTF output when a graphical mode is requested, or auto for automatic selection.
        Default: auto
        Choices:
        - auto
        - surface
        - opengl
        - openglnb
        - openglhq
        - openglpp
        - direct3d
        - direct3d11
        - metal
      Winperc:
        Type: int
        Description: Specifies the window percentage for the TTF output (100 = full screen). Ignored if the ptsize setting is specified.
        Default: "60"
      EnableWinPercLimit:
        Type: bool
        Description: If set, a TrueType window size will be limited to 60 percent of the screen. Enabled by default; optionally disable the limit when using more than 25 lines in a TTF window.
        Default: "true"
      Ptsize:
        Type: int
        Description: 'Specifies the font point size for the TTF output. If specified (minimum: 9), it will override the winperc setting.'
        Default: "0"
      Lins:
        Type: int
        Description: Specifies the number of rows on the screen for the TTF output (0 = default).
        Default: "0"
      Cols:
        Type: int
        Description: Specifies the number of columns on the screen for the TTF output (0 = default).
        Default: "0"
      Righttoleft:
        Type: bool
        Description: If set, DOSBox-X will display text from right to left instead of left to right on the screen for the TTF output. This is especially useful for languages which use right-to-left scripts (such as Arabic and Hebrew).
        Default: "false"
      Wp:
        Type: string
        Description: You can specify a word processor for the TTF output and optionally also a version number for the word processor. Supported word processors are WP=WordPerfect, WS=WordStar, XY=XyWrite, FE=FastEdit, and an optional version number. For example, WP6 will set the word processor as WordPerfect 6, and XY4 will set the word processor as XyWrite 4. Word processor-specific features like on-screen text styles and 512-character font will be enabled based on this.
      Bold:
        Type: bool
        Description: If set, DOSBox-X will display bold text in visually (requires a word processor be set) for the TTF output. This is done either with the actual bold font specified by the fontbold option, or by making it bold automatically.
        Default: "true"
      Italic:
        Type: bool
        Description: If set, DOSBox-X will display italicized text visually (requires a word processor be set) for the TTF output. This is done either with the actual italic font specified by the fontital option, or by slanting the characters automatically.
        Default: "true"
      Underline:
        Type: bool
        Description: If set, DOSBox-X will display underlined text visually (requires a word processor be set) for the TTF output.
        Default: "true"
      Strikeout:
        Type: bool
        Description: If set, DOSBox-X will display strikeout text visually (requires a word processor be set) for the TTF output.
        Default: "false"
      Printfont:
        Type: bool
        Description: If set, DOSBox-X will force to use the current TrueType font (set via font option) for printing in addition to displaying.
        Default: "true"
      Autodbcs:
        Type: bool
        Description: 'If set, DOSBox-X enables Chinese/Japanese/Korean DBCS (double-byte) characters when these code pages are active by default. Only applicable when using a DBCS code page (932: Japanese, 936: Simplified Chinese; 949: Korean; 950: Traditional Chinese) This applies to both the display and printing of these characters (see the [printer] section for details of the latter).'
        Default: "true"
      Blinkc:
        Type: bool
        Description: If set to true, the cursor blinks for the TTF output; setting it to false will turn the blinking off. You can also change the blinking rate by setting an integer between 1 (fastest) and 7 (slowest), or 0 for no cursor.
        Default: "true"
      Gbk:
        Type: bool
        Description: Enables the GBK extension (in addition to the standard GB2312 charset) for the Simplified Chinese TTF output or DOS/V emulation.
        Default: "false"
      Chinasea:
        Type: bool
        Description: Enables the ChinaSea and Big5-2003 extension (in addition to the standard Big5-1984 charset) for the Traditional Chinese TTF output. A TTF/OTF font containing such characters (such as the included SarasaGothicFixed TTF font) is needed to correctly render ChinaSea characters.
        Default: "false"
      Dosvfunc:
        Type: bool
        Description: If set, enables FEP control to function for Japanese DOS/V applications, and changes the blinking of character attributes to high brightness.
        Default: "false"
