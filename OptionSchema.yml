      Voodoo_maxmem:
        Type: bool
        Description: Specify whether to enable maximum memory size for the Voodoo card. If set (on by default), the memory size will be 12MB (4MB front buffer + 2x4MB texture units) Otherwise, the memory size will be the standard 4MB (2MB front buffer + 1x2MB texture unit)
        Default: "true"
      Glide:
        Type: bool
        Description: Enable Glide emulation (Glide API passthrough to the host). Requires a Glide wrapper - glide2x.dll (Windows), libglide2x.so (Linux), or libglide2x.dylib (macOS).
        Default: "false"
      Lfb:
        Type: choice
        Description: Enable LFB access for Glide. OpenGlide does not support locking aux buffer, please use _noaux modes.
        Default: full_noaux
        Choices:
        - full
        - full_noaux
        - read
        - read_noaux
        - write
        - write_noaux
        - none
      Splash:
        Type: bool
        Description: Show 3dfx splash screen for Glide emulation (Windows; requires 3dfxSpl2.dll).
        Default: "true"
  Ipx:
    DisplayName: IPX Networking
    Description: |
      IPX over UDP/IP. This is what makes DOS-era LAN play work on a modern network: Doom, Descent, Duke Nukem 3D and Warcraft II only ever spoke IPX, which no current operating system carries. Enable it on every client, then use the IPXNET command inside DOSBox-X to connect them to one host.
    Options:
      Ipx:
        Type: bool
        Description: Enable ipx over UDP/IP emulation.
        Default: "false"
  Ne2000:
    DisplayName: NE2000 Ethernet
    Description: |
      An emulated NE2000 card, for DOS games and applications that speak TCP/IP through a packet driver rather than IPX.
    Options:
      Ne2000:
        Type: bool
        Description: Enable NE2000 Ethernet emulation. Either pcap or slirp backend can be used, switchable via "backend" option. Settings for the pcap and slirp backends can be found in the [ethernet, pcap] and [ethernet, slirp] sections. Once properly set, load the NE2000 packet driver inside DOSBox-X with base address and interrupt specified below.
        Default: "false"
      Nicbase:
        Type: int
        Description: The base address of the NE2000 board.
        Default: "300"
      Nicirq:
        Type: int
        Description: The interrupt it uses. Note serial2 uses IRQ3 as default.
        Default: "3"
      Macaddr:
        Type: string
        Description: The MAC address the emulator will use for its network adapter. If you have multiple DOSBox-Xes running on the same network, this has to be changed for each. AC:DE:48 is an address range reserved for private use, so modify the last three number blocks, e.g. AC:DE:48:88:99:AB. Default setting is 'random' which randomly chooses a MAC address.
        Default: random
      Backend:
        Type: choice
        Description: The backend (either pcap or slirp is supported) used for the NE2000 Ethernet emulation. If set to "auto", then "slirp" is selected when available, otherwise "pcap" is selected when available. NE2000 Ethernet emulation will be disabled if no backend is available (or the specified backend if unavailable).
        Default: auto
        Choices:
        - pcap
        - slirp
        - ethnet
        - nothing
        - auto
        - none
  Ethernet_pcap:
    DisplayName: Ethernet (pcap backend)
    Description: |
      Bridges the emulated NE2000 onto a real network interface. Needs Npcap on the host and a wired adapter -- promiscuous mode does not work over Wi-Fi.
    Options:
      Realnic:
        Type: string
        Description: Specifies which of your host network interfaces is used for pcap. Write 'list' here to see the list of devices from the Help menu ('List network interfaces') or from the Status Window. Then make your choice and put either the interface number (e.g. 2) or a part of your adapters name (e.g. VIA here).
        Default: list
      Timeout:
        Type: string
        Description: Specifies the read timeout for the device in milliseconds for the pcap backend, or the default value will be used.
        Default: default
  Ethernet_slirp:
    DisplayName: Ethernet (slirp backend)
    Description: |
      User-mode networking for the emulated NE2000. Needs no drivers and no elevation, but the guest sits behind NAT and cannot be connected to directly.
    Options:
      Ipv4_network:
        Type: string
        Description: The IPv4 network the guest and host services are on.
        Default: 10.0.2.0
      Ipv4_netmask:
        Type: string
        Description: The netmask for the IPv4 network.
        Default: 255.255.255.0
      Ipv4_host:
        Type: string
        Description: The address of the guest on the IPv4 network.
        Default: 10.0.2.2
      Ipv4_nameserver:
        Type: string
        Description: The address of the nameserver service provided by the host on the IPv4 network.
        Default: 10.0.2.3
      Ipv4_dhcp_start:
        Type: string
        Description: The start address used for DHCP by the host services on the IPv4 network.
        Default: 10.0.2.15
  Serial:
    DisplayName: Serial Ports
    Description: COM1-COM4, including null-modem links for two-player games over a serial cable.
    Options:
      Serial1:
        Type: choice
        Description: 'serial1-9 -- set type of device connected to the serial (COM) port. Can be disabled, dummy, file, modem, nullmodem, directserial. Additional parameters must be in the same line in the form of parameter:value. Parameter for all types is irq (optional). for file: specify an output file Additional parameters: timeout:<milliseconds> = how long to wait before closing the file on inactivity (default:0), squote to use single quotes instead of double quotes for quoted program commands. shellhide to hide the command window when opening programs on the Windows platform. openwith:<program>: start a program to open the output file. openerror:<program>: start a program to open the output file if an error had occurred. multiplier:<x>: Actual baud rate is the programmed rate times X to allow rates higher than 115200. Example: serial1=file file:output1.txt timeout:1000 openwith:notepad for directserial: realport (required), rxdelay (optional). (realport:COM1 realport:ttyS0). for modem: listenport (optional). for nullmodem: server, rxdelay, txdelay, telnet, usedtr, transparent, port, inhsocket, sock, nonlocal (all optional). connections are limited to localhost unless you specify nonlocal:1 "sock" parameter specifies the protocol to be used by both sides of the connection. 0 for TCP and 1 for ENet reliable UDP. Example: serial1=modem listenport:5000 sock:1 Note: COM1-4 are standard COM ports in DOS, whereas COM5-9 are extended COM ports. You can optionally specify base addresses and IRQs for them with base: and irq: options. Serial port settings can also be changed via the built-in SERIAL command.'
        Default: dummy
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial2:
        Type: choice
        Description: see serial1
        Default: dummy
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial3:
        Type: choice
        Description: see serial1
        Default: disabled
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial4:
        Type: choice
        Description: see serial1
        Default: disabled
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial5:
        Type: choice
        Description: see serial1
        Default: disabled
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial6:
        Type: choice
        Description: see serial1
        Default: disabled
        Choices:
        - dummy
        - disabled
        - modem
        - nullmodem
        - serialmouse
        - directserial
        - log
        - file
      Serial7:
        Type: choice
        Description: see serial1
        Default: disabled
        Choices:
        - dummy
