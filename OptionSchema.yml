  Voodoo:
    DisplayName: 3dfx Voodoo
    Description: Glide acceleration for the small number of DOS titles that used it.
    Options:
      Voodoo_card:
        Type: choice
        Description: Enable support for the 3dfx Voodoo card.
        Default: auto
        Choices:
        - "false"
