        Default: ps2
  Pc98:
    DisplayName: NEC PC-98
    Description: Only takes effect when machine is set to a PC-98 type.
    Options:
      Pc_98BIOScopyrightstring:
        Type: bool
        Description: If set, the PC-98 BIOS copyright string is placed at E800:0000. Enable this for software that detects PC-98 vs Epson.
        Default: "false"
      Pc_98fmboard:
        Type: choice
        Description: In PC-98 mode, selects the FM music board to emulate.
        Default: auto
        Choices:
        - auto
        - "off"
        - "false"
        - board14
        - board26k
        - board86
        - board86c
      Pc_98enable256_color:
        Type: bool
        Description: Allow 256-color graphics mode if set, disable if not set
        Default: "true"
      Pc_98enable16_color:
        Type: bool
        Description: Allow 16-color graphics mode if set, disable if not set
        Default: "true"
      Pc_98enablegrcg:
        Type: bool
        Description: Allow GRCG graphics functions if set, disable if not set
        Default: "true"
      Pc_98enableegc:
        Type: bool
        Description: Allow EGC graphics functions if set, disable if not set
        Default: "true"
      Pc_98busmouse:
        Type: bool
        Description: Enable PC-98 bus mouse emulation. Disabling this option does not disable INT 33h emulation.
        Default: "true"
      Pc_98forceibmkeyboardlayout:
        Type: choice
        Description: Force to use a default keyboard layout like IBM US-English for PC-98 emulation. Will only work with apps and games using BIOS for keyboard.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Pc_98forceJISkeyboardlayout:
        Type: bool
        Description: Force to use a default keyboard layout like JIS (JP106) for PC-98 emulation. Will only work with apps and games using BIOS for keyboard.
        Default: "false"
      Pc_98tryfontrom:
        Type: bool
        Description: If enabled, DOSBox-X will first try to load FONT.ROM as generated by T98Tools for PC-98 emulation.
        Default: "true"
      Pc_98anex86font:
        Type: string
        Description: Specify an Anex86 compatible font to load as supported by the Anex86 emulator for PC-98 emulation. By default DOSBox-X tries to load ANEX86.BMP followed by FREECG98.BMP after trying to load FONT.ROM. If you specify a font here then it will be tried first, perhaps before FONT.ROM (see previous option).
  Dosv:
    DisplayName: DOS/V
    Description: Japanese DOS/V text and font handling. Only relevant to DOS/V software.
    Options:
      Dosv:
        Type: choice
        Description: Enable DOS/V emulation and specify which version to emulate. This option is intended for use with games or software originating from East Asia (China, Japan, Korea) that use the double byte character set (DBCS) encodings and DOS/V extensions to display Japanese (jp), Chinese (chs/cht/cn/tw), or Korean (ko) text. Note that enabling DOS/V replaces 80x25 text mode with a EGA/VGA graphics mode that emulates text mode to display the characters and may be incompatible with non-Asian software that assumes direct access to the text mode via segment 0xB800. For a general DOS environment with CJK support please disable DOS/V emulation and use TrueType font (TTF) output with a CJK code page (932, 936, 949, 950) and TTF font with CJK characters instead.
        Default: "off"
        Choices:
        - "off"
        - jp
        - ko
        - chs
        - cht
        - cn
        - tw
      Getsysfont:
        Type: bool
        Description: If enabled, DOSBox-X will try to get and use the system fonts on Windows and Linux platforms for the DOS/V emulation. If this cannot be done, then DOSBox-X will try to use the internal Japanese DOS/V font, or you can specify a different font.
        Default: "true"
      Fontxsbcs:
        Type: string
        Description: FONTX2 file used to rendering SBCS characters (8x19) in DOS/V or JEGA mode. If not specified, the default one will be used. Loading the ASC16 and ASCFONT.15 font files (from the UCDOS and ETen Chinese DOS systems) is also supported for the DOS/V mode.
      Fontxsbcs16:
        Type: string
        Description: FONTX2 file used to rendering SBCS characters (8x16) in DOS/V or JEGA mode. If not specified, the default one will be used. Loading the ASC16 and ASCFONT.15 font files (from the UCDOS and ETen Chinese DOS systems) is also supported for the DOS/V mode.
      Fontxsbcs24:
        Type: string
        Description: FONTX2 file used to rendering SBCS characters (12x24) in DOS/V mode (with V-text). If not specified, the default one will be used. Loading the ASC24 and ASCFONT.24? font files (the latter from the ETen Chinese DOS system) is also supported for the DOS/V mode.
      Fontxdbcs:
        Type: string
        Description: FONTX2 file used to rendering DBCS characters (16x16) in DOS/V or VGA/JEGA mode. If not specified, the default one will be used. Alternatively, you can load a BDF or PCF font file (16x16 or 15x15), such as the free bitmap fonts from WenQuanYi (https://wenq.org/). For Simplified Chinese DOS/V, loading the HZK16 font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported. For Traditional Chinese DOS/V, loading the STDFONT.15 font file from the ETen Chinese DOS system is also supported.
      Fontxdbcs14:
        Type: string
        Description: FONTX2 file used to rendering DBCS characters (14x14) for Configuration Tool or EGA mode. If not specified, the default one will be used. Alternatively, you can load a BDF or PCF font file (14x14 or 15x15), such as the free bitmap fonts from WenQuanYi (https://wenq.org/). For Simplified Chinese DOS/V, loading the HZK14 font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported. For Traditional Chinese DOS/V, loading the STDFONT.15 font file from the ETen Chinese DOS system is also supported.
      Fontxdbcs24:
        Type: string
        Description: FONTX2 file used to rendering DBCS characters (24x24) in DOS/V mode (with V-text and 24-pixel fonts enabled). For Simplified Chinese DOS/V, loading the HZK24? font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported. For Traditional Chinese DOS/V, loading the STDFONT.24 font file from the ETen Chinese DOS system is also supported.
      Showdbcsnodosv:
        Type: choice
        Description: Enables rendering of Chinese/Japanese/Korean characters for DBCS code pages in standard VGA and EGA machine types in non-DOS/V and non-TTF mode. DOS/V fonts will be used in such cases, which can be adjusted by the above config options (such as fontxdbcs, fontxdbcs14, and fontxdbcs24). Setting to "auto" enables Chinese/Japanese/Korean character rendering if a language file is loaded (or with "autodbcs" option set) in such cases.
        Default: auto
        Choices:
        - "true"
        - "false"
        - "1"
        - "0"
        - auto
      Yen:
        Type: bool
        Description: Enables the Japanese yen symbol at 5ch if it is found at 7fh in a custom SBCS font for the Japanese DOS/V or JEGA emulation.
        Default: "false"
      Fepcontrol:
        Type: choice
        Description: FEP control API for the DOS/V emulation.
        Default: both
        Choices:
        - ias
        - mskanji
        - both
      Vtext1:
        Type: choice
        Description: V-text screen mode 1 for the DOS/V emulation. Enter command "VTEXT 1" for this mode. Note that XGA/SXGA mode is only supported by the svga_s3trio and svga_et4000 machine types.
        Default: svga
        Choices:
        - xga
        - xga24
        - sxga
        - sxga24
        - svga
      Vtext2:
        Type: choice
        Description: V-text screen mode 2 for the DOS/V emulation. Enter command "VTEXT 2" for this mode. Note that XGA/SXGA mode is only supported by the svga_s3trio and svga_et4000 machine types.
        Default: xga
        Choices:
        - xga
        - xga24
        - sxga
        - sxga24
        - svga
      Use20pixelfont:
        Type: bool
        Description: Enables the 20 pixel font to be used instead of the 24 pixel system font for the Japanese DOS/V emulation (with V-text enabled).
        Default: "false"
      J3100:
        Type: choice
        Description: With the setting dosv=jp and a non-off value of this option, the Toshiba J-3100 machine will be emulated with DCGA support. Setting to "on" or "auto" starts J-3100 automatically, and with the setting "manual" you can enter J-3100 mode with DCGA command.
        Default: "off"
        Choices:
        - "off"
        - "on"
        - auto
        - manual
        - "0"
        - "1"
        - "2"
      J3100type:
        Type: choice
        Description: Specifies the Toshiba J-3100 machine type if J-3100 mode is enabled. The color palette will be changed with different machine types.
        Default: default
        Choices:
        - default
        - gt
        - sgt
        - gx
        - gl
        - sl
        - sgx
        - ss
        - gs
        - sx
        - sxb
        - sxw
        - sxp
        - ez
        - zs
        - zx
      J3100colorscroll:
        Type: bool
        Description: Specifies that the color display can be used for scrolling, which is currently incompatible with for example the J-3100 version of the SimCity game. The VGA version of the Toshiba Windows 3.1 works fine with the "false" value of this setting, whereas its CGA/EGA version requires a "true" value for this.
        Default: "false"
  Log:
    DisplayName: Logging
    Description: Diagnostic output. Useful when a game will not start, and noise otherwise.
    Options:
      Logfile:
