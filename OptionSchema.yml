      Mpubase:
        Type: choice
        Description: The IO address of the MPU-401. Set to 0 to use a default I/O address. 300h to 330h are for use with IBM PC mode. C0D0h to F8D0h (in steps of 800h) are for use with NEC PC-98 mode (MPU98). 80D2h through 80DEh are for use with NEC PC-98 Sound Blaster 16 MPU-401 emulation. If not assigned (0), 330h is the default for IBM PC and E0D0h is the default for PC-98.
        Default: "0"
        Choices:
        - "0"
        - "300"
        - "310"
        - "320"
        - "330"
        - "332"
        - "334"
        - "336"
        - "340"
        - "360"
        - c0d0
        - c8d0
        - d0d0
        - d8d0
        - e0d0
        - e8d0
        - f0d0
        - f8d0
        - 80d2
        - 80d4
        - 80d6
        - 80d8
        - 80da
        - 80dc
        - 80de
      Mididevice:
        Type: choice
        Description: Device that will receive the MIDI data from MPU-401.
        Default: default
        Choices:
        - default
        - win32
        - alsa
        - oss
        - coreaudio
        - coremidi
        - mt32
        - synth
        - fluidsynth
        - timidity
        - none
      Midiconfig:
        Type: string
        Description: "Special configuration options for the device driver. This is usually the id or part of the name of the device you want to use (find the id/name with mixer/listmidi). Or in the case of coreaudio or synth, you can specify a soundfont here. When using a Roland MT-32 rev. 0 as midi output device, some games may require a delay in order to prevent 'buffer overflow' issues. In that case, add 'delaysysex', for example: midiconfig=2 delaysysex See the README/Manual for more details."
      Samplerate:
        Type: choice
        Description: Sample rate for MIDI synthesizer, if applicable.
        Default: "48000"
        Choices:
        - "49716"
        - "48000"
        - "44100"
        - "32000"
        - "22050"
        - "16000"
        - "11025"
        - "8000"
      Mpuirq:
        Type: int
        Description: MPU-401 IRQ. -1 to automatically choose.
        Default: "-1"
      Mt32_romdir:
        Type: string
        Description: 'Name of the directory where MT-32 Control and PCM ROM files can be found. Emulation requires these files to work. Accepted file names are as follows: MT32_CONTROL.ROM or CM32L_CONTROL.ROM - control ROM file. MT32_PCM.ROM or CM32L_PCM.ROM - PCM ROM file.'
      Mt32_model:
        Type: choice
        Description: Model of the MT-32 synthesizer to use.
        Default: auto
        Choices:
        - cm32l
        - mt32
        - auto
      Fluid_driver:
        Type: choice
        Description: Driver to use with Fluidsynth, not needed under Windows. Available drivers depend on what Fluidsynth was compiled with.
        Default: default
        Choices:
        - pulseaudio
        - alsa
        - oss
        - coreaudio
        - dsound
        - portaudio
        - sndman
        - jack
        - file
        - default
      Fluid_soundfont:
        Type: string
        Description: Soundfont (.SF2 or .SF3) to use with Fluidsynth. One must be specified (e.g. GeneralUser_GS.sf2).
  Speaker:
